<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Marshmallow Pals</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
    font-family: "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
    background: linear-gradient(180deg, #8fd8ff 0%, #c9efff 60%, #e9fbff 100%);
    color: #3b2f55;
  }
  .card {
    width: 100%;
    max-width: 380px;
    background: #ffffff;
    border-radius: 28px;
    padding: 32px 24px 28px;
    text-align: center;
    box-shadow: 0 12px 30px rgba(40, 90, 140, 0.25);
  }
  .pals { font-size: 54px; letter-spacing: 6px; margin-bottom: 12px; }
  h1 { font-size: 28px; color: #e2577a; margin-bottom: 6px; }
  .sub { font-size: 15px; color: #7a6c96; margin-bottom: 22px; }
  p.msg { font-size: 17px; line-height: 1.45; margin-bottom: 26px; }
  .btn {
    display: block;
    width: 100%;
    padding: 16px;
    border-radius: 999px;
    background: #5ec26a;
    color: #fff;
    font-size: 19px;
    font-weight: bold;
    text-decoration: none;
    box-shadow: 0 6px 0 #3f9a4b;
    transition: transform .1s, box-shadow .1s;
  }
  .btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #3f9a4b; }
  .note { margin-top: 18px; font-size: 13px; color: #8a7fa3; line-height: 1.4; }
</style>
</head>
<body>
  <div class="card">
    <div class="pals">🐱🐙🐸</div>
    <h1>Marshmallow Pals</h1>
    <div class="sub">¡Nos mudamos!</div>
    <p class="msg">El juego ya no se juega aquí.<br>Ahora está en la <b>app para Android</b>, con vidas, power-ups y mundos nuevos.</p>
    <a class="btn" href="https://play.google.com/apps/testing/app.marshmallowpals.game">Descargar la app</a>
    <p class="note">Si te dice que no tenés acceso, avisame para agregar tu correo a la lista de prueba.</p>
  </div>

<script>
  // Limpia la versión vieja que el navegador haya guardado
  try {
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function (regs) {
        regs.forEach(function (r) { r.unregister(); });
      }).catch(function () {});
    }
    if (window.caches) {
      caches.keys().then(function (keys) {
        keys.forEach(function (k) { caches.delete(k); });
      }).catch(function () {});
    }
  } catch (e) {}
</script>
</body>
</html>
